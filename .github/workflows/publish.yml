name: Publish

on:
  push:
    tags: [ v* ]

jobs:
  # Phase 5, item 5.2: reject a tag that doesn't match vMAJOR.MINOR.PATCH before anything
  # else runs - no pre-release/build-metadata suffixes, matching ADR004's policy. This gates
  # `build` below so a malformed tag fails fast instead of burning the full test matrix first.
  validate-tag:
    runs-on: ubuntu-latest
    steps:
    - name: Validate tag format
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Tag '$TAG' does not match the required vMAJOR.MINOR.PATCH format." >&2
          exit 1
        fi

  # Phase 5, item 5.1: publish now depends on build.yml succeeding on this exact commit,
  # instead of running independently. Calling it as a reusable workflow (rather than
  # duplicating its steps here) means it can never drift out of sync with the real gate.
  build:
    needs: validate-tag
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x' # SDK Version to use.

    - name: Setup Version
      id: setup_version
      run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_OUTPUT

    - name: Pack NuGet Package
      run: dotnet pack ./src/RingBufferPlus/RingBufferPlus.csproj -c Release -o ./dist -p:Version=${{ steps.setup_version.outputs.VERSION }}

    - name: Publish
      run: dotnet nuget push dist/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
