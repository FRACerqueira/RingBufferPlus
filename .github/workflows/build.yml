name: Build

on:
  push:
    # Tag pushes are covered by publish.yml, which calls this workflow itself (workflow_call)
    # as its quality gate - skip the direct trigger here to avoid running it twice per tag.
    tags-ignore: [ 'v*' ]
  pull_request:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        # The test project multi-targets net8.0/net9.0/net10.0 (ADR002) - dotnet test runs
        # every TFM automatically, but actually EXECUTING net8.0/net9.0 binaries needs their
        # runtimes installed side by side with net10.0, not just the SDK used to build.
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Build project
      run: dotnet build RingBufferPlus.sln -c Release

    - name: Run test cases
      run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.os }}
        path: ./coverage
        retention-days: 14

  # Phase 6, item 6.7: catch link rot across README/CHANGELOG/doc/guides/doc/architecture
  # before it reaches a released tag. Runs once, independently of the build matrix above.
  # Deliberately --offline: this repo already links to a few external hosts that are flaky
  # or redirect (an old MSDN doc page, shields.io badges) - checking those is out of scope
  # here and would make this job flaky for reasons unrelated to our own docs. --offline
  # restricts lychee to local file/anchor links, which is exactly what the doc restructuring
  # in this phase needs covered.
  link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Check markdown links
      uses: lycheeverse/lychee-action@v2
      with:
        args: >-
          --no-progress --offline --exclude-mail
          README.md CHANGELOG.md CONTRIBUTING.md "doc/**/*.md"
        fail: true
