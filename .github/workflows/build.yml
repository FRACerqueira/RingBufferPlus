name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        # The test project multi-targets net8.0/net9.0/net10.0 (ADR002) - dotnet test runs
        # every TFM automatically, but actually EXECUTING net8.0/net9.0 binaries needs their
        # runtimes installed side by side with net10.0, not just the SDK used to build.
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Build project
      run: dotnet build RingBufferPlus.sln -c Release

    - name: Run test cases
      run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.os }}
        path: ./coverage
        retention-days: 14
