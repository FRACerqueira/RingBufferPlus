name: CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "src/**"
      - "tests/**"
      - "**/*.slnx"
      - "**/*.csproj"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "src/**"
      - "tests/**"
      - "**/*.slnx"
      - "**/*.csproj"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # TEMPORARY: --collect:"XPlat Code Coverage" removed below to test whether coverlet's
      # profiler/named-pipe handshake is racing with the blame hang-dump collector at
      # test-host startup - the trx from a hung run showed the host crashing right after
      # "Starting: RingBufferPlus.Tests", before any test ran, which is that race's profile.
      # Restore once confirmed either way.
      - name: Test
        run: >
          dotnet test
          --framework net10.0
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --blame-hang-timeout 90s
          --blame-hang-dump-type full

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/**/*.trx"
          retention-days: 7

      - name: Upload hang dump
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hang-dump-${{ matrix.os }}
          path: |
            **/TestResults/**/*.dmp
            **/TestResults/**/Sequence.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          retention-days: 7
          if-no-files-found: ignore
